<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Workspace</title>
  <meta name="description" content="Free-form workspace for building flow questions and answer paths." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="flow-workspace.css" />
</head>
<body>
  <div class="workspace-shell">
    <header class="workspace-header">
      <div>
        <div class="eyebrow">Planner</div>
        <h1>Interactive Flow Workspace</h1>
        <p>Create boxes, drag them freely, and connect ideas into a full survey tree.</p>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Workspace controls">
        <button id="add-node" class="btn btn-primary" type="button">Add Box</button>
        <button id="connect-mode" class="btn" type="button" aria-pressed="false">Connect Mode: Off</button>
        <button id="delete-selected" class="btn" type="button">Delete Selected</button>
        <button id="clear-board" class="btn btn-danger" type="button">Clear Board</button>
      </div>
      <div class="toolbar toolbar-secondary" role="toolbar" aria-label="Workspace data controls">
        <button id="save-layout" class="btn" type="button">Save</button>
        <button id="load-layout" class="btn" type="button">Load</button>
        <button id="export-layout" class="btn" type="button">Export JSON</button>
        <button id="zoom-out" class="btn" type="button">Zoom -</button>
        <button id="zoom-reset" class="btn" type="button">Zoom 100%</button>
        <button id="zoom-in" class="btn" type="button">Zoom +</button>
        <span id="zoom-readout" class="zoom-readout">100%</span>
      </div>
    </header>

    <section class="workspace-stage-wrap" aria-label="Flow workspace canvas">
      <div id="workspace-stage" class="workspace-stage">
        <svg id="connection-layer" class="connection-layer" aria-hidden="true">
          <defs>
            <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z"></path>
            </marker>
          </defs>
        </svg>
        <div id="node-layer" class="node-layer"></div>
      </div>
    </section>

    <p class="status" id="status-message">Tip: double-click anywhere on the canvas to add a new box at that position.</p>
  </div>

  <script src="flow-workspace.js"></script>
</body>
</html>
