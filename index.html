<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We Want to Know You Better</title>
  <meta name="description" content="A mobile-friendly customer experience survey designed to better understand each customer and deliver personalized offers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <h1>We Want to Know Our Customers Better</h1>
        <p>We want to understand what matters most to our customers so we can deliver the right experience, every time.</p>
      </div>
    </header>

    <section class="test-toolbar" aria-label="Survey test controls">
      <button class="test-reset-button" id="test-restart-button" type="button">Restart from beginning</button>
    </section>

    <main class="survey-card">
      <div class="progress-shell" aria-label="Survey progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <section id="survey-content" class="survey-content" aria-live="polite"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
